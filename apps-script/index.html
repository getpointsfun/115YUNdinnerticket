<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ok:#15803d; --okbg:#dcfce7; --warn:#a16207; --warnbg:#fef9c3; --bad:#b91c1c; --badbg:#fee2e2;
          --ink:#111827; --mute:#6b7280; --line:#d1d5db; --bg:#f3f4f6; --pri:#1d4ed8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); font-size:18px; }
  .hidden { display:none !important; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 12px; position:sticky; top:0; z-index:5; }
  .desks { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .desks b { font-size:15px; color:var(--mute); }
  .desk { border:2px solid var(--line); background:#fff; border-radius:10px; padding:8px 14px; font-size:18px; font-weight:700; }
  .desk.on { background:var(--pri); border-color:var(--pri); color:#fff; }
  .sync { font-size:15px; font-weight:700; margin-left:auto; padding:4px 10px; border-radius:999px; }
  .sync.ok { background:var(--okbg); color:var(--ok); } .sync.warn { background:var(--warnbg); color:var(--warn); } .sync.bad { background:var(--badbg); color:var(--bad); }
  .stats { margin-top:8px; font-size:16px; color:var(--mute); display:flex; gap:14px; flex-wrap:wrap; }
  .stats b { color:var(--ink); }
  main { padding:12px; max-width:760px; margin:0 auto; }
  .bar { display:flex; gap:8px; }
  .bar input { flex:1; min-width:0; font-size:22px; padding:14px; border:2px solid var(--line); border-radius:12px; }
  button { font-family:inherit; cursor:pointer; }
  .btn { border:0; border-radius:12px; padding:14px 18px; font-size:20px; font-weight:700; background:var(--pri); color:#fff; }
  .btn.sec { background:#fff; color:var(--ink); border:2px solid var(--line); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-top:12px; border:1px solid var(--line); }
  .banner { margin-top:12px; border-radius:14px; padding:16px; font-size:22px; font-weight:800; }
  .banner.ok { background:var(--okbg); color:var(--ok); }
  .banner.warn { background:var(--warnbg); color:var(--warn); }
  .banner.bad { background:var(--badbg); color:var(--bad); }
  .banner small { display:block; font-weight:500; font-size:16px; margin-top:4px; }
  .who { font-size:26px; font-weight:800; }
  .org { color:var(--mute); font-size:17px; margin-top:2px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:#eef2ff; color:#3730a3; border-radius:999px; padding:6px 14px; font-weight:700; font-size:18px; }
  .chip.gift { background:#fff7ed; color:#9a3412; }
  .t { display:flex; gap:12px; align-items:center; padding:12px 4px; border-top:1px solid var(--line); }
  .t input[type=checkbox] { width:30px; height:30px; flex:none; }
  .t .info { flex:1; min-width:0; }
  .t .nm { font-weight:700; }
  .t .st { font-size:15px; margin-top:2px; }
  .st.done { color:var(--ok); } .st.part { color:var(--warn); } .st.none { color:var(--mute); }
  .gf { background:#fde4ea !important; color:#9b2c4a; font-weight:700 !important; }
  .dd { cursor:pointer; padding:6px 12px !important; font-size:15px !important; margin-left:8px !important; }
  .dd.empty { background:var(--warnbg); color:var(--warn); font-weight:700; }
  #dietDlg { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  #dietDlg .box { background:#fff; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px 22px; }
  #dietDlg h3 { margin:0 0 12px; font-size:20px; }
  #dietDlg .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #dietDlg .opts button { padding:16px; font-size:20px; font-weight:800; border-radius:12px; border:2px solid var(--line); background:#fff; }
  #dietDlg .opts button.p { background:var(--pri); border-color:var(--pri); color:#fff; }
  #dietDlg input { width:100%; font-size:20px; padding:12px; border:2px solid var(--line); border-radius:12px; margin-top:10px; }
  #dietDlg .row { display:flex; gap:10px; margin-top:12px; }
  #dietDlg .row button { flex:1; padding:13px; font-size:18px; border-radius:12px; border:2px solid var(--line); background:#fff; font-weight:700; }
  .diet { font-size:14px; background:#f3f4f6; border-radius:6px; padding:1px 7px; margin-left:6px; font-weight:500; }
  .undo { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:14px; color:var(--mute); }
  .actions { display:grid; gap:10px; margin-top:14px; }
  .actions .btn.main { font-size:24px; padding:18px; background:var(--ok); }
  .list .row { display:flex; justify-content:space-between; align-items:center; padding:14px 6px; border-top:1px solid var(--line); cursor:pointer; }
  .list .row:first-child { border-top:0; }
  .dash .bn { font-size:46px; font-weight:900; line-height:1.1; }
  .dash .bn small { font-size:17px; color:var(--mute); font-weight:600; }
  .dash h4 { margin:18px 0 8px; font-size:15px; color:var(--mute); letter-spacing:.05em; }
  .seg { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
  .seg button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 13px; font-size:14px; font-weight:700; color:var(--mute); }
  .seg button.on { background:var(--pri); border-color:var(--pri); color:#fff; }
  .ringbig { text-align:center; } .ringbig svg { max-width:100%; height:auto; }
  .tiles3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .tiles3 div { background:#f3f4f6; border-radius:14px; padding:12px 6px; text-align:center; }
  .tiles3 b { display:block; font-size:28px; } .tiles3 span { color:var(--mute); font-size:14px; }
  .rings { display:grid; grid-template-columns:repeat(3,1fr); gap:12px 8px; }
  .rg { text-align:center; } .rg svg { max-width:100%; height:auto; } .rg span { display:block; font-size:14px; margin-top:2px; }
  .tg { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .t1 { background:#f3f4f6; border-radius:16px; padding:12px 14px; }
  .t1.a { background:#dcfce7; }
  .t1 span { display:block; font-size:14px; color:var(--mute); } .t1 b { display:block; font-size:34px; line-height:1.15; }
  .t1 em { font-style:normal; font-size:17px; color:var(--mute); font-weight:600; } .t1 small { color:var(--mute); font-size:13px; }
  .tbs { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .tb { background:#f3f4f6; border-radius:14px; padding:9px 11px; cursor:pointer; }
  .tb.full { background:#dcfce7; } .tb.open { grid-column:1/3; }
  .tb .th { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; } .tb .th span { color:var(--mute); font-size:14px; }
  .tb .dots { margin:6px 0 0; gap:5px; } .tb .dots i { width:15px; height:15px; background:#d1d5db; } .tb .dots i.g { background:#16a34a; } .tb .dots i.b { background:#38bdf8; }
  .tl { margin-top:8px; border-top:1px solid var(--line); } .tr { display:flex; justify-content:space-between; padding:6px 0; font-size:15px; }
  .tr em { font-style:normal; font-size:13px; font-weight:700; padding:2px 9px; border-radius:99px; background:#e5e7eb; color:var(--mute); }
  .tr em.g { background:var(--okbg); color:var(--ok); } .tr em.b { background:var(--warnbg); color:var(--warn); }
  .dots { display:flex; flex-wrap:wrap; gap:4px; margin:10px 0 6px; }
  .dots i, .lg i { display:inline-block; width:12px; height:12px; border-radius:50%; background:#e5e7eb; }
  .dots i.g, .lg i.g { background:#16a34a; } .dots i.b, .lg i.b { background:#38bdf8; }
  .lg { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--mute); } .lg i { margin-right:4px; vertical-align:-1px; }
  .chipsd { display:flex; gap:8px; flex-wrap:wrap; } .cd { background:#f3f4f6; border-radius:999px; padding:6px 12px; font-size:15px; } .cd b { margin-left:4px; }
  .dr { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:7px 0; border-top:1px solid var(--line); align-items:center; }
  .dr b { font-variant-numeric:tabular-nums; }
  .dr.rc { grid-template-columns:auto 1fr auto; }
  .dr .sm { color:var(--mute); font-size:14px; }
  .dg { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px; }
  .dg div { background:#f3f4f6; border-radius:12px; padding:10px 4px; text-align:center; }
  .dg b { display:block; font-size:24px; } .dg span { font-size:13px; color:var(--mute); display:block; }
  .fl { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .fl button { border:2px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:15px; font-weight:700; color:var(--ink); }
  .fl button.on { background:var(--pri); border-color:var(--pri); color:#fff; }
  .rrow { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .rrow .a { min-width:0; } .rrow .nm { font-weight:700; } .rrow .og { font-size:14px; color:var(--mute); }
  .badge { flex:none; font-size:14px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .b-arrived { background:var(--okbg); color:var(--ok); } .b-partial { background:var(--warnbg); color:var(--warn); }
  .b-waiting { background:#e0e7ff; color:#3730a3; } .b-noreply { background:#f3f4f6; color:var(--mute); } .b-declined { background:var(--badbg); color:var(--bad); }
  #rq { width:100%; font-size:17px; padding:10px; border:2px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:16px; } td,th { padding:6px 4px; border-top:1px solid var(--line); text-align:left; }
  .link { background:none; border:0; color:var(--pri); font-size:16px; padding:8px 0; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; padding:12px 18px; border-radius:10px; font-size:17px; z-index:20; max-width:90vw; }
</style>
</head>
<body>

<div id="login" class="hidden"><main>
  <div class="card">
    <div class="who">工作人員登入</div>
    <div class="org" id="loginMsg">請輸入工作人員密碼</div>
    <div class="bar" style="margin-top:12px"><input id="pin" type="password" inputmode="numeric" placeholder="密碼"><button class="btn" id="pinGo">進入</button></div>
  </div>
</main></div>

<div id="app" class="hidden">
  <header>
    <div class="desks"><b>我是</b>
      <button class="desk" data-d="1">1</button><button class="desk" data-d="2">2</button>
      <button class="desk" data-d="3">3</button><button class="desk" data-d="4">4</button><b>號報到處</b><span class="sync ok" id="sync">✔ 已同步</span>
    </div>
    <div class="stats" id="stats"></div>
    <div id="syncErr" class="hidden" style="margin-top:6px;font-size:14px;color:var(--bad)"></div>
  </header>
  <main>
    <div class="bar">
      <input id="q" placeholder="掃描 QR 或輸入代號、姓名" autocomplete="off" autocapitalize="off">
      <button class="btn" id="go">查詢</button>
    </div>
    <div id="alerts"></div>
    <div id="banner"></div>
    <div id="result"></div>
    <button class="link" id="dashBtn">🏠 概況</button>
    <button class="link" id="rosterBtn">👥 名冊(誰到了、誰還沒到)</button>
    <div id="roster" class="card hidden"></div>
    <button class="link hidden" id="boardBtn">📊 看板(各報到處、禮品、葷素統計)</button>
    <div id="board" class="card hidden"></div>
  </main>
</div>

<div id="dietDlg" class="hidden">
  <div class="box">
    <h3 id="dietTitle">葷素?</h3>
    <div class="opts">
      <button id="dMeat">葷食</button><button id="dVeg">素食</button>
      <button id="dOther">其他…</button><button id="dSkip">先不填</button>
    </div>
    <div id="dOtherBox" class="hidden"><input id="dOtherIn" placeholder="例如:不吃牛肉、海鮮過敏" autocomplete="off"><div class="row"><button id="dOtherOk" class="p" style="background:var(--pri);border-color:var(--pri);color:#fff">確定</button></div></div>
    <div class="row"><button id="dCancel">取消</button></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var PIN = store.get('pin'), DESK = store.get('desk');
  var T = {};            // 本機名單:票號(小寫) -> 票
  var Q = [];            // 待送出的操作(依序)
  var conflicts = [];    // 事後發現的重複
  var dashOn = false, lastErr = '', sending = false, online = true, started = false, cur = '', pulling = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.add('hidden'); }, 3500);
  }
  function nowStr() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + 'd' + DESK; }
  function extractCode(q) {
    q = String(q == null ? '' : q).trim();
    var m = q.match(/[?&]t=([^&\s#]+)/);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
    return q;
  }
  function suffix(t) { var m = t.code.match(/-(\d+)$/); return m ? parseInt(m[1], 10) : 0; }
  function list() { return Object.keys(T).map(function (k) { return T[k]; }); }
  function partyTickets(p) {
    var k = norm(p);
    return list().filter(function (t) { return norm(t.party) === k; }).sort(function (a, b) { return suffix(a) - suffix(b); });
  }

  /* ───── 本機暫存(斷網也能繼續) ───── */
  function saveLocal() { store.set('snap', JSON.stringify(list())); store.set('queue', JSON.stringify(Q)); }
  function restoreLocal() {
    try {
      JSON.parse(store.get('snap') || '[]').forEach(function (t) { T[norm(t.code)] = t; });
      Q = JSON.parse(store.get('queue') || '[]');
    } catch (e) {}
  }

  /* ───── 與試算表同步 ───── */
  function renderSync() {
    var el = $('sync');
    var se = $('syncErr'); if (se) { se.textContent = lastErr ? '⚠ 同步失敗:' + lastErr : ''; se.classList.toggle('hidden', !lastErr); }
    if (Q.length) { el.textContent = '⏳ 待同步 ' + Q.length + ' 筆'; el.className = 'sync warn'; }
    else if (!online) { el.textContent = '⚠ 離線(用暫存資料)'; el.className = 'sync bad'; }
    else { el.textContent = '✔ 已同步'; el.className = 'sync ok'; }
  }
  function pendingCodes() {
    var s = {};
    Q.forEach(function (op) { (op.codes || [op.code]).forEach(function (c) { s[norm(c)] = 1; }); });
    return s;
  }
  function mergeSnapshot(arr) {
    var pend = pendingCodes(), n = {};
    arr.forEach(function (t) { var k = norm(t.code); n[k] = (pend[k] && T[k]) ? T[k] : t; });
    T = n; saveLocal(); renderStats();
    if (dashOn) renderDash();
    if (!$('roster').classList.contains('hidden')) renderRoster();
  }
  function pullSnapshot(cb) {
    if (pulling) return; pulling = true;
    google.script.run.withSuccessHandler(function (r) {
      pulling = false;
      if (r && r.auth === false) { showLogin(r.error); return; }
      if (r && r.ok) { online = true; mergeSnapshot(r.tickets); renderSync(); if (cb) cb(true); }
      else { renderSync(); if (cb) cb(false); }
    }).withFailureHandler(function () {
      pulling = false; online = false; renderSync(); if (cb) cb(false);
    }).api(PIN, 'snapshot', {});
  }
  function pump() {
    if (sending || !Q.length) { renderSync(); return; }
    sending = true;
    var op = Q[0];
    google.script.run.withSuccessHandler(function (r) {
      sending = false;
      if (r && r.auth === false) { showLogin(r.error); return; }
      Q.shift(); saveLocal(); online = true; lastErr = '';
      if (!r || r.ok === false) toast('⚠ 有一筆同步失敗:' + ((r && r.error) || '未知原因') + '。請通知管理員。');
      else handleResults(r);
      renderSync(); pump();
    }).withFailureHandler(function (e) {
      sending = false; online = false; lastErr = String((e && e.message) || e || '未知錯誤').slice(0, 160); renderSync();
    }).api(PIN, op.kind, op);
  }
  function handleResults(r) {
    (r.results || []).forEach(function (x) {
      if (x.status === 'dup') {
        var t = T[norm(x.code)];
        if (t) { t.inAt = x.inAt; t.inDesk = x.inDesk; t.giftAt = x.giftAt; t.giftDesk = x.giftDesk; }
        conflicts.push(x.code + ' 其實早已於 ' + x.inAt + ' 在第 ' + x.inDesk + ' 號報到處' + (x.giftAt ? '報到並領禮' : '報到') + '。這次是重複入場,請確認!');
      } else if (x.status === 'notfound') {
        conflicts.push('找不到 ' + x.code + '(名單可能已被更動)');
      }
    });
    renderAlerts();
  }
  function renderAlerts() {
    $('alerts').innerHTML = conflicts.map(function (c, i) {
      return '<div class="banner bad">⚠ ' + esc(c) + ' <button class="undo" data-i="' + i + '">知道了</button></div>';
    }).join('');
    [].forEach.call($('alerts').querySelectorAll('button'), function (b) {
      b.onclick = function () { conflicts.splice(+b.dataset.i, 1); renderAlerts(); };
    });
  }

  /* 手機內建相機掃 QR 會開啟「網址?t=票號」,這裡讀出票號(不依賴伺服器端樣板) */
  function getInitial(cb) {
    try {
      google.script.url.getLocation(function (loc) {
        var t = loc && loc.parameter && loc.parameter.t;
        cb(t ? String(Array.isArray(t) ? t[0] : t) : '');
      });
    } catch (e) { cb(''); }
  }

  /* ───── 登入 / 啟動 ───── */
  function showLogin(msg) {
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('loginMsg').textContent = msg || '請輸入工作人員密碼';
    $('pin').value = ''; $('pin').focus();
  }
  $('pinGo').onclick = function () { PIN = $('pin').value.trim(); store.set('pin', PIN); boot(); };
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') $('pinGo').click(); };

  function boot() {
    if (!started) restoreLocal();
    pullSnapshot(function (ok) {
      if (!ok && !Object.keys(T).length) { showLogin('連線失敗,且這台裝置還沒有暫存名單。請確認網路後再試。'); return; }
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      drawDesks(); renderStats(); renderSync(); pump();
      if (!started) renderDash();
      if (!ok) toast('目前離線,使用這台裝置上次載入的名單');
      if (!started) {
        started = true;
        setInterval(function () { pullSnapshot(); }, 8000);
        setInterval(pump, 4000);
        getInitial(function (t) { if (t) search(t); else $('q').focus(); });
      }
    });
  }

  /* ───── 報到處 / 統計 ───── */
  function drawDesks() {
    [].forEach.call(document.querySelectorAll('.desk'), function (b) {
      b.classList.toggle('on', b.dataset.d === DESK);
      b.onclick = function () { DESK = b.dataset.d; store.set('desk', DESK); drawDesks(); $('q').focus(); };
    });
  }
  function needDesk() { if (!DESK) { toast('請先在上方點選「你是幾號報到處」'); return true; } return false; }

  function computeStats() {
    var s = { total: 0, in: 0, gift: 0, byDesk: {}, gifts: {}, diets: {} };
    list().forEach(function (t) {
      s.total++;
      var gt = t.gift || '(未設定)'; s.gifts[gt] = s.gifts[gt] || { total: 0, given: 0 }; s.gifts[gt].total++;
      var dt = t.diet || '(未填)'; s.diets[dt] = (s.diets[dt] || 0) + 1;
      if (t.inAt) { s.in++; (s.byDesk[t.inDesk] = s.byDesk[t.inDesk] || { in: 0, gift: 0 }).in++; }
      if (t.giftAt) { s.gift++; s.gifts[gt].given++; (s.byDesk[t.giftDesk] = s.byDesk[t.giftDesk] || { in: 0, gift: 0 }).gift++; }
    });
    return s;

     就自動移到輸入框,避免掃描的字被吃掉或誤按到按鈕。 */
  document.addEventListener('keydown', function (e) {
    if ($('app').classList.contains('hidden')) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'radio'))) return;  // 正在文字框打字(輸入框、名冊搜尋、葷素)就不要搶
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    $('q').focus();
  }, true);
  /* 點空白處也回到輸入框,保持隨時可掃 */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if ($('app').classList.contains('hidden')) return;
    if (t.closest && t.closest('button, input, a, .row, #dietDlg, #roster')) return;
    $('q').focus();
  });

  /* ───── 名冊:每位貴賓到了沒有 ───── */
  var ROSTER = null, rFilter = 'waiting', rQuery = '';
  var STATUS = { arrived: '已到', partial: '部分到', waiting: '尚未到', noreply: '未回函', declined: '不克出席' };
  var FILTERS = [['waiting', '尚未到(已回函)'], ['partial', '部分到'], ['arrived', '已到'], ['noreply', '未回函'], ['declined', '不克出席'], ['all', '全部']];
  function rStatus(g) {
    var ts = partyTickets(g.code), inN = ts.filter(function (t) { return t.inAt; }).length;
    if (inN) return inN === ts.length ? 'arrived' : 'partial';
    if (g.rsvp === 'no') return 'declined';
    if (g.rsvp === 'yes') return 'waiting';
    return 'noreply';
  }
  function loadRoster() {
    $('roster').innerHTML = '<div class="org">讀取名冊中…</div>';
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.auth === false) { showLogin(r.error); return; }
      if (!r || r.ok === false) { $('roster').innerHTML = '<div class="org">名冊讀取失敗:' + esc((r && r.error) || '未知原因') + '</div>'; return; }
      ROSTER = r; renderRoster();
    }).withFailureHandler(function (e) {
      $('roster').innerHTML = '<div class="org">名冊讀取失敗(請檢查網路):' + esc((e && e.message) || e || '') + '</div>';
    }).api(PIN, 'roster', {});
  }
  function renderRoster() {
    if (!ROSTER) return;
    var rows = ROSTER.rows.map(function (g) { var ts = partyTickets(g.code); g._s = rStatus(g); g._in = ts.filter(function (t) { return t.inAt; }).length; g._n = ts.length; return g; });
    var cnt = { all: rows.length }; rows.forEach(function (g) { cnt[g._s] = (cnt[g._s] || 0) + 1; });
    var q = norm(rQuery);
    var shown = rows.filter(function (g) {
      return (rFilter === 'all' || g._s === rFilter) && (!q || norm(g.name).indexOf(q) >= 0 || norm(g.org).indexOf(q) >= 0 || norm(g.code).indexOf(q) >= 0 || norm(g.type).indexOf(q) >= 0);
    });
    var h = '<div class="fl">' + FILTERS.map(function (f) {
      return '<button data-f="' + f[0] + '" class="' + (rFilter === f[0] ? 'on' : '') + '">' + f[1] + ' ' + (cnt[f[0]] || 0) + '</button>';
    }).join('') + '</div><input id="rq" placeholder="搜尋姓名、單位、類別、代號" value="' + esc(rQuery) + '" autocomplete="off">';
    if (ROSTER.rsvpError) h += '<div class="org" style="color:var(--bad);margin-top:8px">⚠ 讀不到回函資料(' + esc(ROSTER.rsvpError) + '),「未回函/不克出席」可能不準。</div>';
    h += '<div class="org" style="margin:8px 0">顯示 ' + shown.length + ' 位' + (shown.length > 300 ? '(只列前 300 位,請用搜尋縮小範圍)' : '') + '</div>';
    h += shown.slice(0, 300).map(function (g) {
      var extra = g._n > 1 ? '(' + g._in + '/' + g._n + ' 人)' : '';
      return '<div class="rrow" data-c="' + esc(g.code) + '"><div class="a"><div class="nm">' + esc(g.name) + ' <span class="og">' + esc(g.code) + '</span></div>' +
        '<div class="og">' + esc(g.org) + (g.table ? '・第 ' + esc(g.table) + ' 桌' : '') + '</div></div>' +
        '<span class="badge b-' + g._s + '">' + STATUS[g._s] + extra + '</span></div>';
    }).join('');
    h += '<button class="link" id="rReload">↻ 重新讀取名冊(同步最新回函)</button>';
    var keepFocus = document.activeElement && document.activeElement.id === 'rq', pos = keepFocus ? document.activeElement.selectionStart : 0;
    $('roster').innerHTML = h;
    [].forEach.call($('roster').querySelectorAll('.fl button'), function (b) { b.onclick = function () { rFilter = b.dataset.f; renderRoster(); }; });
    $('rq').oninput = function () { rQuery = this.value; renderRoster(); };
    if (keepFocus) { $('rq').focus(); try { $('rq').setSelectionRange(pos, pos); } catch (e) {} }
    $('rReload').onclick = loadRoster;
    [].forEach.call($('roster').querySelectorAll('.rrow'), function (r) {
      r.onclick = function () {
        if (!partyTickets(r.dataset.c).length) { toast('這位貴賓目前沒有報到名額(不克出席,或還沒按選單④)'); return; }
        window.scrollTo(0, 0); search(r.dataset.c);
      };
    });
  }
  $('rosterBtn').onclick = function () {
    var open = $('roster').classList.toggle('hidden') === false;
    if (open) { if (ROSTER) renderRoster(); loadRoster(); }
  };

  window.addEventListener('online', function () { pump(); pullSnapshot(); });
  if (PIN) boot(); else showLogin();
})();
</script>
</body>
</html>
