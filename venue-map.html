<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西螺森活武樹園區 場地配置圖</title>
<style>
:root{--bg:#f6f4ee;--fg:#222;--card:#fff;--line:#d8d3c4;--grass:#8db37a;--road:#9a9a9a;--out:#dcdcdc;--path:#eceae0;--pond:#8fc3da;--tbl:#fff;--tblst:#55663f;--tent:#f3c874;--tentst:#c98f20;--stage:#8a1f6a;--buf:#c27dc4;--mkt:#2f9a4a;--prep:#f2a97a;--svc:#fff;--warn:#b3541e;--lab:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d201b;--fg:#ecebe4;--card:#2a2e27;--line:#454a40;--grass:#47633b;--road:#606060;--out:#33352f;--path:#8c8b80;--pond:#27506a;--tbl:#3a4034;--tblst:#b8c9a4;--warn:#f0a070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans TC",sans-serif}
main{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{font-size:13px;opacity:.75;margin:0 0 6px}
.note{background:var(--card);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.bar button.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.t{cursor:pointer}.t:hover .top{stroke-width:3;stroke:var(--warn)}
text{font-family:inherit;fill:var(--fg);pointer-events:none}
</style>
</head>
<body>
<main>
<h1>西螺森活武樹園區 場地配置圖</h1>
<p class="sub">風沙退場・雲林好食宴(115 年 YUN 晚餐券)</p>
<div class="note">⚠️ 本圖依<b>主辦方公布的場地圖</b>重新繪製(戶外用餐區 200 人、休閒用餐區 300 人,共 500 人)。原圖為示意圖、非等比例;本圖的位置與桌數是依原圖與衛星圖(約 6.7 px = 1 m)推算,實際桌位、帳篷尺寸與動線請以主辦單位現場圖為準。</div>
<div class="bar" id="views"></div>
<div class="wrap"><svg id="map" viewBox="60 830 1790 940" role="img" aria-label="場地配置圖"></svg></div>
<div class="grid">
  <div class="card"><h2>選取桌位</h2><div id="info">點選地圖上的圓桌查看資訊。</div></div>
  <div class="card"><h2>統計</h2><div id="stats"></div></div>
</div>
<div class="card" style="margin-top:14px"><h2>分區說明與動線</h2><table id="zones"></table></div>
</main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("map");
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function el(tag,a={},txt,p=svg){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
const pts=a=>a.map(p=>p.join(",")).join(" ");
function label(x,y,t,fs=22,a={}){t.split("\n").forEach((l,i,arr)=>el("text",{x,y:y+(i-(arr.length-1)/2)*fs*1.15+fs*.35,"text-anchor":"middle","font-size":fs,...a},l))}
const ANG=22.1; // 雲24 線斜率

// ── 底圖 ──
el("rect",{x:0,y:0,width:2000,height:2000,fill:css("--out")});
// 雲24 鄉道
el("polygon",{points:pts([[115,855],[1815,1545],[1815,1613],[115,923]]),fill:css("--road")});
label(300,905,"雲24 鄉道",30,{transform:`rotate(${ANG} 300 905)`,style:"fill:#fff"});
// 園區草地
el("polygon",{points:pts([[175,935],[1255,1372],[1735,1560],[1740,1685],[540,1685],[300,1620],[230,1500],[195,1250]]),fill:css("--grass")});
// 環園步道
el("polyline",{points:pts([[1255,1410],[1180,1380],[900,1262],[640,1175],[500,1215],[380,1290],[300,1400],[290,1500],[340,1600],[520,1658],[900,1672],[1290,1676]]),fill:"none",stroke:css("--path"),"stroke-width":34,"stroke-linecap":"round","stroke-linejoin":"round"});
el("path",{d:"M1285 1480 V1675",stroke:css("--path"),"stroke-width":22,fill:"none"});
// 生態池
el("path",{d:"M415 1395 Q520 1370 620 1395 Q720 1375 825 1385 Q850 1430 800 1475 Q700 1470 620 1465 Q520 1500 440 1475 Q405 1440 415 1395Z",fill:css("--pond")});
label(620,1428,"生態池(禁入)",22,{style:"fill:#245"});
// 入口廣場
el("circle",{cx:1320,cy:1440,r:70,fill:css("--path")});
el("path",{d:"M1272 1442 A48 48 0 0 1 1376 1430",fill:"none",stroke:"#e07a1f","stroke-width":14,"stroke-linecap":"round"});
el("circle",{cx:1320,cy:1468,r:16,fill:"#6b2a9a"});
label(1415,1465,"入口",26,{style:"fill:#e07a1f"});
label(1322,1512,"成果展示區",16,{style:"fill:#222"});
// 貴賓報到、服務台
el("rect",{x:1266,y:1435,width:26,height:26,fill:"#fff",stroke:"#555","stroke-width":2});
label(1205,1436,"貴賓報到區",15,{style:"fill:#222"});
el("rect",{x:1348,y:1470,width:26,height:26,fill:"#fff",stroke:"#555","stroke-width":2,transform:"rotate(20 1361 1483)"});
label(1405,1510,"服務台",16,{style:"fill:#222"});
// 市集區(沿道路)
{const g=el("g",{});for(let i=0;i<24;i++){const x=1255+i*16,y=1328+i*6.5;el("rect",{x,y:y-12,width:15,height:24,fill:css("--mkt"),stroke:"#1d5a2c","stroke-width":1,transform:`rotate(${ANG} ${x} ${y})`},null,g)}}
label(1560,1390,"市集區",26,{style:"fill:#2f9a4a",transform:"rotate(22 1560 1390)"});
// 備餐區(東南)
el("path",{d:"M1455 1560 H1690 V1675 H1640 V1610 H1455Z",fill:css("--path")});
el("rect",{x:1468,y:1572,width:130,height:60,fill:css("--prep"),rx:4});
label(1533,1602,"備餐區",24,{style:"fill:#333"});
// BUFFET(北側沿道路 5 組、南側 3 組)
const buf=(x,y,rot=0)=>{el("rect",{x:x-26,y:y-14,width:24,height:28,fill:css("--buf"),stroke:"#8a4f8c","stroke-width":1.5,transform:`rotate(${rot} ${x} ${y})`});el("rect",{x:x+2,y:y-14,width:24,height:28,fill:css("--buf"),stroke:"#8a4f8c","stroke-width":1.5,transform:`rotate(${rot} ${x} ${y})`})};
[[665,1166],[785,1222],[918,1275],[1040,1330],[1162,1380]].forEach(([x,y])=>buf(x,y,ANG));
[[660,1622],[770,1604],[862,1612]].forEach(([x,y])=>buf(x,y,0));
label(735,1155,"BUFFET",22,{transform:`rotate(${ANG} 735 1155)`,style:"fill:#fff"});
label(935,1250,"BUFFET",22,{transform:`rotate(${ANG} 935 1250)`,style:"fill:#fff"});
label(1095,1315,"BUFFET",22,{transform:`rotate(${ANG} 1095 1315)`,style:"fill:#fff"});
label(770,1650,"BUFFET",22,{style:"fill:#fff"});
// 舞台、音控、醫護、表演團體
el("rect",{x:970,y:1590,width:62,height:34,fill:css("--stage"),rx:3});
label(1001,1607,"舞台",22,{style:"fill:#fff"});
[["音控區",1050],["音控區",1070],["醫護站",1090],["表演\n團體區",1110],["表演\n團體區",1130]].forEach(([t,x],i)=>{
  el("rect",{x:x-9,y:1628+i*3,width:18,height:30,fill:"#fff",stroke:"#555","stroke-width":1.5,transform:`rotate(${i*4-8} ${x} ${1643})`})});
label(1090,1692,"音控・醫護站・表演團體",16);

// ── 餐桌 ──
const tables=[];
// 戶外用餐區 200 人(20 桌)
[[400,1150],[330,1225],[470,1275]].forEach(([x,y])=>tables.push({x,y,zone:"戶外用餐區",grp:"西北草地"}));
for(let r=0;r<2;r++)for(let c=0;c<5;c++)tables.push({x:580+36*c,y:1298+r*40,zone:"戶外用餐區",grp:"池北"});
[[400,1566],[460,1566],[520,1566],[580,1566],[640,1566],[705,1522],[785,1530]].forEach(([x,y])=>tables.push({x,y,zone:"戶外用餐區",grp:"池南"}));
tables.forEach((t,i)=>{t.id="O"+(i+1)});
// 休閒用餐區 300 人(8 頂星形帳篷,共 30 桌)
const tents=[[945,1375],[1035,1428],[1105,1470],[1190,1490],[905,1478],[1010,1530],[1120,1555],[1212,1555]],tentCount=[4,4,4,4,4,4,3,3];
const tentBase=[];
tents.forEach(([cx,cy],k)=>{const p=[];for(let i=0;i<16;i++){const a=i/16*2*Math.PI,r=i%2?26:46;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
  el("polygon",{points:pts(p),fill:css("--tent"),stroke:css("--tentst"),"stroke-width":2});
  const off=[[-14,-14],[14,-14],[-14,14],[14,14]];
  for(let j=0;j<tentCount[k];j++)tables.push({x:cx+off[j][0],y:cy+off[j][1],zone:"休閒用餐區",grp:`帳篷 ${k+1}`,id:`T${k+1}-${j+1}`,tent:true})});
tables.forEach(t=>{const g=el("g",{class:"t"});const cr=t.tent?3.2:3.6,dr=t.tent?9:11,tr=t.tent?6.5:8;
  for(let i=0;i<10;i++){const a=i/10*2*Math.PI;el("circle",{cx:t.x+dr*Math.cos(a),cy:t.y+dr*Math.sin(a),r:cr,fill:css("--tblst")},null,g)}
  el("circle",{class:"top",cx:t.x,cy:t.y,r:tr,fill:css("--tbl"),stroke:css("--tblst"),"stroke-width":1.5},null,g);
  g.addEventListener("click",()=>show(t))});
label(540,1236,"戶外用餐區\n200 人",26,{style:"fill:#fff;font-weight:700"});
label(1130,1632,"休閒用餐區 300 人",24,{style:"fill:#222;font-weight:700"});

// 比例尺(約 6.7 px = 1 m)與指北
el("rect",{x:120,y:1730,width:134,height:7,fill:"#222"});label(187,1716,"約 20 m",18);

// 資訊與統計
const info=document.getElementById("info");
function show(t){info.innerHTML=`<b>${t.id} 桌</b><br>座位:10 席<br>區域:${t.zone}(${t.grp})`}
const nO=tables.filter(t=>t.zone==="戶外用餐區").length,nT=tables.length-nO;
document.getElementById("stats").innerHTML=`<table>
<tr><td>戶外用餐區</td><td>${nO} 桌 = ${nO*10} 人</td></tr>
<tr><td>休閒用餐區</td><td>${nT} 桌 = ${nT*10} 人(8 頂帳篷)</td></tr>
<tr><td>合計</td><td><b>${tables.length*10}</b> 人(${tables.length} 桌)</td></tr>
<tr><td>BUFFET</td><td>8 組(北側 5、南側 3)</td></tr>
<tr><td>市集區</td><td>沿雲24 鄉道,約 24 攤</td></tr></table>
<p style="font-size:12px;margin:8px 0 0">每桌 10 人為推算;原圖只標區域人數,未標桌數。</p>`;
document.getElementById("zones").innerHTML=`<tr><th>區域</th><th>說明</th></tr>
<tr><td><span class="sw" style="background:#fff;border:1px solid var(--tblst)"></span>戶外用餐區</td><td>200 人。圓桌分佈在池北、池南與西北草地,環繞生態池</td></tr>
<tr><td><span class="sw" style="background:var(--tent)"></span>休閒用餐區</td><td>300 人。8 頂星形帳篷,靠近入口與舞台</td></tr>
<tr><td><span class="sw" style="background:var(--buf)"></span>BUFFET</td><td>取餐點分散在環園步道的北側(沿道路)與南側,縮短排隊距離</td></tr>
<tr><td><span class="sw" style="background:var(--stage)"></span>舞台與後台</td><td>舞台在南側步道旁;音控、醫護站、表演團體區緊鄰舞台東側</td></tr>
<tr><td><span class="sw" style="background:#e07a1f"></span>入口</td><td>東側圓形廣場。貴賓報到區、服務台、成果展示區都設在入口周邊</td></tr>
<tr><td><span class="sw" style="background:var(--mkt)"></span>市集區</td><td>沿雲24 鄉道的東北側,與用餐區分開</td></tr>
<tr><td><span class="sw" style="background:var(--prep)"></span>備餐區</td><td>東南角,餐點由此經南側步道送往各 BUFFET</td></tr>
<tr><td><span class="sw" style="background:var(--pond)"></span>生態池</td><td>既有,禁入;建議設護欄</td></tr>`;

// 視角切換
const views={"全區":"60 830 1790 940","戶外用餐區":"200 1080 760 640","休閒用餐區與舞台":"820 1280 560 440","入口與市集":"1180 1280 660 440"};
const bar=document.getElementById("views");
Object.entries(views).forEach(([n,v],i)=>{const b=document.createElement("button");b.textContent=n;if(!i)b.className="on";
  b.onclick=()=>{svg.setAttribute("viewBox",v);[...bar.children].forEach(x=>x.className="");b.className="on"};bar.appendChild(b)});
</script>
</body>
</html>
