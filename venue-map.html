<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西螺森活武樹園區 場地配置圖</title>
<style>
:root{--bg:#f6f4ee;--fg:#222;--card:#fff;--line:#d8d3c4;--grass:#cfe3b4;--wild:#b9d19a;--wood:#6f8f5a;--pond:#8fc3da;--road:#8b8b8b;--out:#e9e4d3;--vip:#f2c14e;--tbl:#fff;--tblst:#55663f;--stage:#c96b4b;--svc:#8aa6c9;--wc:#b9a5d6;--food:#f0a97a;--exist:#c9c2b0;--warn:#b3541e}
@media (prefers-color-scheme:dark){:root{--bg:#1d201b;--fg:#ecebe4;--card:#2a2e27;--line:#454a40;--grass:#3b4f30;--wild:#344628;--wood:#243420;--pond:#27506a;--road:#555;--out:#2f2e27;--tbl:#3a4034;--tblst:#9db08a;--exist:#5a574c;--warn:#f0a070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans TC",sans-serif}
main{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.note{background:var(--card);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.bar button.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.t{cursor:pointer}.t:hover .top{stroke-width:2;stroke:var(--warn)}
text{font-family:inherit;fill:var(--fg);pointer-events:none}
</style>
</head>
<body>
<main>
<h1>西螺森活武樹園區 場地配置圖(115 年 YUN 晚餐券)</h1>
<div class="note">⚠️ <b>依衛星圖描繪的示意規劃,非官方測繪圖。</b>園區位於雲24線西南側(約 1.5 公頃),比例依 Google 地圖比例尺換算(約 6 px = 1 m),誤差可能達數公尺。既有建物用途、草地承重與樹位、餐點站與廁所擺放位置都需<b>現場確認</b>;正式使用請以雲林縣環保局或西螺七崁武術文教基金會提供的竣工圖校正。</div>
<div class="bar" id="views"></div>
<div class="wrap"><svg id="map" viewBox="100 150 1400 720" role="img" aria-label="場地配置圖"></svg></div>
<div class="grid">
  <div class="card"><h2>選取桌位</h2><div id="info">點選地圖上的圓桌查看資訊。</div></div>
  <div class="card"><h2>統計</h2><div id="stats"></div></div>
</div>
<div class="card" style="margin-top:14px"><h2>分區說明與動線</h2><table id="zones"></table></div>
</main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("map"),S=6; // 6 px = 1 m
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function el(tag,a={},txt,p=svg){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
const poly=(pts,a)=>el("polygon",{points:pts.map(p=>p.join(",")).join(" "),...a});
function label(x,y,t,fs=14,a={}){t.split("\n").forEach((l,i,arr)=>el("text",{x,y:y+(i-(arr.length-1)/2)*fs*1.15+fs*.35,"text-anchor":"middle","font-size":fs,...a},l))}
function box(x,y,w,h,fill,t,fs=14,a={}){el("rect",{x,y,width:w,height:h,rx:4,fill,stroke:"#0007","stroke-width":1.2,...a});label(x+w/2,y+h/2,t,fs,a.tcolor?{style:"fill:"+a.tcolor}:{})}

// ── 底圖 ──
el("rect",{x:0,y:0,width:2000,height:1400,fill:css("--out")});
// 雲24 線(園區東北側斜向道路)
const edge=[[100,185],[450,310],[660,390],[850,475],[1060,570],[1180,615],[1410,690],[1500,720]];
poly([...edge.map(([x,y])=>[x,y-100]),...edge.slice().reverse()],{fill:css("--road")});
el("text",{x:700,y:332,"font-size":16,transform:"rotate(24 700 332)","text-anchor":"middle",style:"fill:#fff"},"雲24 線(南側為園區)");
// 南側林帶
poly([[140,560],[240,720],[400,810],[600,770],[860,810],[1060,835],[1420,800],[1500,830],[1500,900],[100,900],[100,640]],{fill:css("--wood")});
label(500,860,"南側林帶(不使用)・大橋路在圖外更南方",14);
// 園區草地
poly([[140,200],[450,310],[660,390],[850,475],[1060,570],[1180,615],[1410,690],[1420,800],[1060,835],[860,810],[600,770],[400,810],[240,720],[140,560]],{fill:css("--wild")});
poly([[330,400],[450,330],[660,390],[850,475],[1060,570],[1180,615],[1180,780],[1060,830],[860,805],[640,735],[500,770],[390,800],[240,700],[240,560]],{fill:css("--grass")});
label(260,330,"西側草坡・疏植小樹\n(不規劃)",14);
// 步道
const path=pts=>el("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:"#f3efe2","stroke-width":8,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.9});
path([[250,640],[240,580],[300,530],[410,400],[440,360],[520,352]]);
path([[390,800],[540,745],[640,725],[800,745],[860,790],[1050,820]]);
path([[1100,745],[1250,760],[1410,775]]);
path([[1085,600],[1085,790]]);
// 生態池(既有,依衛星圖描繪)
el("path",{d:"M320 575 Q420 560 520 580 Q600 570 680 560 Q705 590 690 630 Q640 655 560 640 Q470 672 400 676 Q330 655 320 575Z",fill:css("--pond"),stroke:"#4a8fb0","stroke-width":2});
label(500,615,"生態池(既有・禁入)",16);
// 大樹
el("circle",{cx:565,cy:672,r:40,fill:"#3f6a38",opacity:.85});label(565,672,"既有大樹\n(保留)",12,{style:"fill:#fff"});
// 既有建物
box(1060,592,90,72,css("--exist"),"既有建物\n(用途待確認)",12);

// 舞台(中央草地北緣,朝南)
box(730,582,150,48,css("--stage"),"主舞台 25×8 m",15,{tcolor:"#fff"});
box(890,586,50,38,"#d9b38c","音控\n燈光",12);
box(730,636,40,16,"#d9b38c","直播",11);

// 用餐桌:中央 4 排 × 9 欄、備用加桌區 2 排 × 8 欄;圓桌 Ø1.8 m,桌距 5 m
const tables=[];
for(let r=0;r<4;r++)for(let c=0;c<9;c++)tables.push({id:`C${r*9+c+1}`,x:745+c*30,y:675+r*30,zone:"中央草地",vip:r===0&&c>=1&&c<=4,row:r+1});
for(let r=0;r<2;r++)for(let c=0;c<8;c++)tables.push({id:`N${r*8+c+1}`,x:395+c*30,y:440+r*30,zone:"北側備用區",vip:false,row:r+1});
tables.forEach(t=>{const g=el("g",{class:"t"});
  for(let i=0;i<10;i++){const a=i/10*2*Math.PI;el("circle",{cx:t.x+9*Math.cos(a),cy:t.y+9*Math.sin(a),r:2.4,fill:t.vip?"#b88a1c":css("--tblst")},null,g)}
  el("circle",{class:"top",cx:t.x,cy:t.y,r:6.2,fill:t.vip?css("--vip"):css("--tbl"),stroke:css("--tblst"),"stroke-width":1},null,g);
  el("text",{x:t.x,y:t.y+2.2,"text-anchor":"middle","font-size":5.5},t.id,g);
  g.addEventListener("click",()=>show(t))});
label(960,664,"桌距 5 m",10,{});
label(500,420,"北側備用加桌區(約 16 桌)\n草坡與樹位待現場確認",12);

// 餐點站(中央草地東緣,單排)
for(let i=0;i<5;i++)box(1010,600+i*32,30,30,css("--food"),String(i+1),13);
label(1025,590,"餐點站",12);
box(1010,764,30,16,"#e6c9a8","飲料",10);

// 入口與後場(既有小停車場)
box(1240,690,80,60,"#d8c36a","主入口\n驗票・領取\n晚餐券",13);
box(1325,690,85,60,css("--svc"),"後場 / 餐車\n停放",13);
box(1250,758,70,24,"#e8a0a0","醫護・服務台",11);
// 廁所(擬設)
box(1110,672,100,24,css("--wc"),"流動廁所 A(擬設)",11);
box(1110,702,100,24,css("--wc"),"流動廁所 B(擬設)",11);
box(250,650,70,22,css("--wc"),"無障礙廁所\n(擬設)",10);
// 緊急出口
[["緊急出口 N",925,528],["緊急出口 W",150,604]].forEach(([l,x,y])=>box(x,y,76,18,"#c33",l,11,{tcolor:"#fff"}));
label(962,516,"(人行穿越道)",10);
// 動線
el("path",{d:"M1280 745 L1150 758 L1060 772 L985 782",fill:"none",stroke:"#d33","stroke-width":2.4,"stroke-dasharray":"7 5"});
el("path",{d:"M1085 775 V700",fill:"none",stroke:"#d33","stroke-width":1.5,"stroke-dasharray":"5 4"});
label(1150,790,"入場動線",12,{style:"fill:#d33"});
// 比例尺與指北
el("rect",{x:130,y:840,width:120,height:6,fill:"#222"});label(190,830,"20 m",13);
el("path",{d:"M1440 190 L1452 235 L1440 225 L1428 235Z",fill:"#222"});label(1440,255,"N(約略)",12);

// 資訊與統計
const info=document.getElementById("info");
function show(t){const d=Math.hypot(t.x-805,t.y-606)/S;info.innerHTML=`<b>${t.id} 桌</b>${t.vip?"(貴賓桌)":""}<br>座位:10 席<br>區域:${t.zone}・第 ${t.row} 排<br>距舞台約 ${d.toFixed(0)} m`}
const nC=tables.filter(t=>t.id[0]==="C").length,nN=tables.length-nC,vipN=tables.filter(t=>t.vip).length;
document.getElementById("stats").innerHTML=`<table>
<tr><td>中央草地</td><td>${nC} 桌 = ${nC*10} 席(基本容量)</td></tr>
<tr><td>北側備用區</td><td>${nN} 桌 = ${nN*10} 席(視現場加開)</td></tr>
<tr><td>最大容量</td><td><b>${tables.length*10}</b> 席(${tables.length} 桌)</td></tr>
<tr><td>貴賓桌</td><td>${vipN} 桌(中央第 1 排)</td></tr>
<tr><td>餐點站</td><td>5 站 + 飲料站</td></tr>
<tr><td>廁所</td><td>圖上 3 處;400 人以上建議 ≥ 8 間,需另行租用補足</td></tr></table>
<p style="font-size:12px;margin:8px 0 0">400 人以上時,中央草地 360 席不足,需啟用北側備用區。</p>`;
document.getElementById("zones").innerHTML=`<tr><th>區域</th><th>說明</th></tr>
<tr><td><span class="sw" style="background:var(--stage)"></span>舞台</td><td>中央草地北緣、朝南,約 25×8 m,背景為斜向道路側,音控在東側</td></tr>
<tr><td><span class="sw" style="background:var(--tbl);border:1px solid var(--tblst)"></span>用餐區</td><td>中央草地約 52×37 m 排 36 桌;西北草坡另備 16 桌</td></tr>
<tr><td><span class="sw" style="background:var(--food)"></span>餐點區</td><td>草地東緣單排,靠近後場餐車,取餐與入場動線錯開</td></tr>
<tr><td><span class="sw" style="background:#d8c36a"></span>入口</td><td>利用東側既有小停車場驗票,沿東側步道入場</td></tr>
<tr><td><span class="sw" style="background:var(--pond)"></span>生態池</td><td>西側既有,列為禁入並建議設置護欄;大樹保留</td></tr>
<tr><td><span class="sw" style="background:#c33"></span>緊急出口</td><td>北側人行穿越道、西側步道,另加東側主入口,共 3 處</td></tr>
<tr><td>待確認</td><td>既有建物用途、草地承重與排水、雲24 線車輛管制與接駁、停車場容量</td></tr>`;

// 視角切換
const views={"全區":"100 150 1400 720","用餐區":"340 400 800 440","入口與後場":"1000 560 480 260"};
const bar=document.getElementById("views");
Object.entries(views).forEach(([n,v],i)=>{const b=document.createElement("button");b.textContent=n;if(!i)b.className="on";
  b.onclick=()=>{svg.setAttribute("viewBox",v);[...bar.children].forEach(x=>x.className="");b.className="on"};bar.appendChild(b)});
</script>
</body>
</html>
